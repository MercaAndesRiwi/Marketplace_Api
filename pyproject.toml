[project]
name = "api-marketplace"
version = "0.1.0"
description = "Marketplace events API (F4) for MercadAndes - Clean Architecture"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.2.4",
    "confluent-kafka>=2.5.0",
    "pika>=1.4.4",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "httpx",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
